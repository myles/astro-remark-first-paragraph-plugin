name: Publish Package to NPM

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (analyze and verify, but do not publish or tag)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify package

    runs-on: ubuntu-latest

    steps:
      - id: checkout
        name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: setup-node
        name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          registry-url: "https://registry.npmjs.org"

      - id: install-dependencies
        name: 📦 Install dependencies
        run: npm ci

      - id: verify-package
        name: ✅ Verify package
        run: npm audit signatures

  publish:
    name: Publish package

    runs-on: ubuntu-latest

    needs: verify

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - id: checkout
        name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: setup-node
        name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          registry-url: "https://registry.npmjs.org"

      - id: install-dependencies
        name: 📦 Install dependencies
        run: npm ci

      - id: publish
        name: 🚀 Publish package to NPM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release ${{ inputs.dry_run && '--dry-run' || '' }}
